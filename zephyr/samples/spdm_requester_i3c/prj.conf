# libspdm: requester only, MCTP transport + libmctp bridge.
CONFIG_LIBSPDM=y
CONFIG_LIBSPDM_REQUESTER=y
CONFIG_LIBSPDM_RESPONDER=n
CONFIG_LIBSPDM_CRYPTO_MBEDTLS=y
CONFIG_LIBSPDM_TRANSPORT_MCTP=y
CONFIG_LIBSPDM_TRANSPORT_MCTP_LIBMCTP_BRIDGE=y
CONFIG_LIBSPDM_SECRET_LIB_SAMPLE=y
# Disable libspdm's internal hex-dump prints. The flow is now stable;
# every byte of every SPDM message logged over serial dominates the
# round-trip time on the I3C link (and overflows the log subsystem
# buffer). The application-level LOG_INF calls still trace each phase.
CONFIG_LIBSPDM_DEBUG_ENABLE=n

# Sized for GET_CERTIFICATE with a ~1.5 KiB ECDSA-P256 chain
# (libspdm caps at LIBSPDM_MAX_CERT_CHAIN_SIZE=0x800).
CONFIG_LIBSPDM_MCTP_BUFFER_SIZE=2048
CONFIG_LIBSPDM_MCTP_RX_QUEUE_DEPTH=1

# Zephyr libmctp + I3C controller binding.
CONFIG_I3C=y
CONFIG_MCTP=y
CONFIG_MCTP_I3C_CONTROLLER=y

# A full SPDM_CERTIFICATE response (cert chain plus spdm_cert_chain_t
# header) is ~1.4 KiB, so the default 1 KiB libmctp reassembly cap is
# too small for the inbound message. Size both message and heap to
# comfortably hold our worst-case 2 KiB transfer.
CONFIG_MCTP_MAX_MESSAGE_SIZE=2048
CONFIG_MCTP_HEAP_SIZE=6144

# RNG: npcx4 has no hardware DRBG; see responder prj.conf for details.
CONFIG_TEST_RANDOM_GENERATOR=y

# libspdm context + scratch + send/receive buffers + mbedtls transient
# mallocs (X.509 parse + ECDSA verify).
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_COMMON_LIBC_MALLOC=y
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=16384

# Logging
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_PRINTK=y
