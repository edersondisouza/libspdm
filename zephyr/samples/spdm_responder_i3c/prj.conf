# libspdm: responder only, MCTP transport + libmctp bridge.
CONFIG_LIBSPDM=y
CONFIG_LIBSPDM_REQUESTER=n
CONFIG_LIBSPDM_RESPONDER=y
CONFIG_LIBSPDM_CRYPTO_MBEDTLS=y
CONFIG_LIBSPDM_TRANSPORT_MCTP=y
CONFIG_LIBSPDM_TRANSPORT_MCTP_LIBMCTP_BRIDGE=y
CONFIG_LIBSPDM_SECRET_LIB_SAMPLE=y
CONFIG_LIBSPDM_DEBUG_ENABLE=y

# MCTP bridge sized for ECDSA-P256 CHALLENGE_AUTH: the largest message
# is GET_CERTIFICATE (~1.5 KiB chain) which we cap with
# LIBSPDM_MAX_CERT_CHAIN_SIZE=0x800 in the module CMakeLists. Round up
# to 2 KiB to leave headroom for the spdm_cert_chain_t header and the
# MCTP framing.
CONFIG_LIBSPDM_MCTP_BUFFER_SIZE=2048
CONFIG_LIBSPDM_MCTP_RX_QUEUE_DEPTH=1

# Zephyr libmctp + I3C target binding.
CONFIG_I3C=y
CONFIG_MCTP=y
CONFIG_MCTP_I3C_TARGET=y

# RNG: npcx4 has no hardware DRBG, so we fall back to Zephyr's
# k_cycle_get_32-driven TIMER_RANDOM_GENERATOR (auto-selected by
# CONFIG_TEST_RANDOM_GENERATOR=y). NOT suitable for production --
# real deployments must wire a real entropy source.
CONFIG_TEST_RANDOM_GENERATOR=y

CONFIG_MAIN_STACK_SIZE=4096
# mbedtls X.509 + ECDSA verify can request ~10-12 KiB of transient
# malloc traffic; size both arenas with that working set in mind.
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_COMMON_LIBC_MALLOC=y
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=16384

CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_PRINTK=y
