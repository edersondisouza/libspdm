# libspdm: responder only, MCTP transport + libmctp bridge.
CONFIG_LIBSPDM=y
CONFIG_LIBSPDM_REQUESTER=n
CONFIG_LIBSPDM_RESPONDER=y
CONFIG_LIBSPDM_CRYPTO_NULL=y
CONFIG_LIBSPDM_TRANSPORT_MCTP=y
CONFIG_LIBSPDM_TRANSPORT_MCTP_LIBMCTP_BRIDGE=y
CONFIG_LIBSPDM_SECRET_LIB_SAMPLE=y
CONFIG_LIBSPDM_DEBUG_ENABLE=y

# Trim the bridge to what the null-crypto handshake actually needs.
# Largest SPDM message exchanged in the demo (NEGOTIATE_ALGORITHMS) is
# ~52 bytes; even GET_CERTIFICATE with a small chain stays well under
# 1 KiB.
CONFIG_LIBSPDM_MCTP_BUFFER_SIZE=1024
CONFIG_LIBSPDM_MCTP_RX_QUEUE_DEPTH=1

# Zephyr libmctp + I3C target binding.
CONFIG_I3C=y
CONFIG_MCTP=y
CONFIG_MCTP_I3C_TARGET=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_COMMON_LIBC_MALLOC=y
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=8192

CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_PRINTK=y
