# libspdm
CONFIG_LIBSPDM=y
CONFIG_LIBSPDM_REQUESTER=y
CONFIG_LIBSPDM_RESPONDER=y
CONFIG_LIBSPDM_CRYPTO_NULL=y
CONFIG_LIBSPDM_TRANSPORT_MCTP=y
CONFIG_LIBSPDM_DEBUG_ENABLE=y
CONFIG_LIBSPDM_SECRET_LIB_SAMPLE=y

# Threading / heap. libspdm needs ~32 KiB live working set across two
# contexts + scratch buffers + send/receive buffers (~5 KiB each) +
# transient mallocs from the dispatch path.
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=131072
CONFIG_COMMON_LIBC_MALLOC=y
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=131072

# Print debug info from libspdm.
CONFIG_PRINTK=y
CONFIG_LOG=n
